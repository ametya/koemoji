name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/koemoji.spec --noconfirm --clean --distpath dist --workpath build

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/koemoji/README.md -Force
          Compress-Archive -Path dist/koemoji -DestinationPath dist/koemoji-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koemoji-windows-x64
          path: dist/koemoji-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/koemoji-windows-x64.zip
          generate_release_notes: true
